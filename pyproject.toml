[tool.poetry]
name = "oanda-fxdata-etl"
version = "0.1.0"
description = "ETL scripts which manipulate Oanda FX tick data and allow for ingestion to a timescale db"
authors = ["Juraj Zachar <juraj.zachar@gmail.com>"]
license = "GNU GPL"
packages = [
    { include = "oanda-fxdata-etl" }
]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
psycopg2-binary = {version="*", extras=["pool"]}
SQLAlchemy = "*"
pydantic = "*"
joblib = "*"
websocket-client = "*"
pyyaml = "*"
websockets = "*"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6"
pytest = "*"
coverage = "*"
pytest-cov = "*"
mockito = "*"
testcontainers = {version=">=4", extras=["postgres"]}

[tool.poetry.scripts]
build = "scripts.installer:install"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
